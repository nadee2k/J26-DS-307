[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "focustrack-c1"
version = "0.1.0"
description = "Component 1 research pipeline: context-aware learner interaction-state modelling"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  # core data
  "pandas>=2.2",
  "numpy>=1.26",
  "pyyaml>=6.0",
  # modelling (proposal section 3.5)
  "scikit-learn>=1.5",
  "xgboost>=2.0",
  "hmmlearn>=0.3",
  "scipy>=1.13",
  # reporting
  "matplotlib>=3.9",
  "seaborn>=0.13",
  "joblib>=1.4",
  # real data source
  "python-dotenv>=1.0",
  "supabase>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "jupyter>=1.0",
  "papermill>=2.6",
  "jupytext>=1.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
