[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "component3-cv"
version = "0.1.0"
description = "FocusTrack Component 3: Computer Vision & Visual Behavior Analysis (standalone pipeline)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
component3 = ["web/static/*"]

[project.scripts]
component3 = "component3.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
